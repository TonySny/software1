<div class="peticiones-container">

  <div class="header">
    <h1>📩 Peticiones</h1>
    <button class="logout" routerLink="/home">← Volver</button>
  </div>

  <div class="form-wrapper">
    <div class="form-card">

      <div class="form-header">
        <h2>📩 Nueva Petición</h2>
        <p>Completa el formulario y nuestro equipo atenderá tu solicitud a la brevedad.</p>
      </div>

      <div class="field-group">
        <label>Asunto</label>
        <input type="text" [(ngModel)]="asunto" placeholder="Ej: Solicitud de información" />
      </div>

      <div class="field-group">
        <label>Descripción</label>
        <textarea [(ngModel)]="descripcion" placeholder="Describe tu petición con el mayor detalle posible..." rows="4"></textarea>
      </div>

      <div class="field-group">
        <label>Destino de respuesta</label>
        <input type="email" [(ngModel)]="destino" placeholder="correo@ejemplo.com" />
      </div>

      <div class="field-group">
        <label>Adjuntar archivo</label>
        <div class="file-upload">
          <input type="file" (change)="onFileSelected($event)" id="fileInput" />
          <label for="fileInput" class="file-label">📎 Seleccionar archivo</label>
        </div>
      </div>

      <button class="btn-enviar" (click)="enviarPeticion()">✉️ Enviar Petición</button>

    </div>
  </div>

</div>
