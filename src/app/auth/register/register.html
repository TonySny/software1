<div class="register-container">
  <div class="register-card">
    <h2>Crear Cuenta</h2>

    <form (ngSubmit)="register()">

      <div class="row-group">
        <div class="input-group">
          <input type="text" [(ngModel)]="name" name="name" placeholder=" " required />
          <label>Nombre</label>
        </div>
        <div class="input-group">
          <input type="text" [(ngModel)]="surname" name="surname" placeholder=" " required />
          <label>Apellido</label>
        </div>
      </div>

      <div class="row-group">
        <div class="input-group">
          <select [(ngModel)]="tipoDocumento" name="tipoDocumento" required>
            <option value="" disabled selected>Tipo doc.</option>
            <option value="CC">C.C.</option>
            <option value="TI">T.I.</option>
            <option value="CE">C.E.</option>
            <option value="PP">Pasaporte</option>
          </select>
          <label class="select-label">Tipo documento</label>
        </div>
        <div class="input-group">
          <input type="text" [(ngModel)]="numeroDocumento" name="numeroDocumento" placeholder=" " required />
          <label>Número documento</label>
        </div>
      </div>

      <div class="row-group">
        <div class="input-group">
          <select [(ngModel)]="sexo" name="sexo" required>
            <option value="" disabled selected>Sexo</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
          <label class="select-label">Sexo</label>
        </div>
        <div class="input-group">
          <input type="number" [(ngModel)]="edad" name="edad" placeholder=" " required min="18" max="120" />
          <label>Edad</label>
        </div>
      </div>

      <div class="input-group">
        <select [(ngModel)]="grupoEtnico" name="grupoEtnico" required>
          <option value="" disabled selected>Grupo étnico</option>
          <option value="ninguno">Ninguno</option>
          <option value="indigena">Indígena</option>
          <option value="afrocolombiano">Afrocolombiano</option>
          <option value="raizal">Raizal</option>
          <option value="palenquero">Palenquero</option>
          <option value="mestizo">Mestizo</option>
        </select>
        <label class="select-label">Grupo étnico</label>
      </div>

      <div class="input-group">
        <input type="text" [(ngModel)]="ciudad" name="ciudad" placeholder=" " required />
        <label>Ciudad de origen</label>
      </div>

      <div class="input-group">
        <input type="email" [(ngModel)]="email" name="email" placeholder=" " required />
        <label>Correo electrónico</label>
      </div>

      <div class="input-group">
        <input type="password" [(ngModel)]="password" name="password" placeholder=" " required />
        <label>Contraseña</label>
      </div>

      <div class="input-group">
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder=" " required />
        <label>Confirmar contraseña</label>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>

      <p class="extra">
        ¿Ya tienes cuenta? <a routerLink="/">Inicia sesión</a>
      </p>

    </form>
  </div>
</div>
